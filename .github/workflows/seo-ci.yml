name: SEO and PHP CI
on:
  push:
    paths: ['app/**','config/**','public/**','tools/**','.github/workflows/seo-ci.yml']
  pull_request:
    paths: ['app/**','config/**','public/**','tools/**','.github/workflows/seo-ci.yml']
permissions: {contents: read}
concurrency: {group: 'seo-${{ github.ref }}', cancel-in-progress: true}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with: {php-version: '8.2'}
      - name: PHP syntax
        run: find app config public tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Editorial policy
        run: php tools/check_copy_policy.php
      - name: SEO integrity
        run: php tools/seo_audit.php
