name: SOCIAL81+ Telegram Test

on:
  workflow_dispatch:
    inputs:
      text:
        description: Test message to publish
        required: false
        default: '🟠 81+ | Test automatico SOCIAL81+ — collegamento Telegram operativo.'

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish test to Sicurissimo Online
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '@sicurissimoonline'
          SOCIAL81_TELEGRAM_TEXT: ${{ inputs.text }}
        run: python social81/telegram/publish.py
